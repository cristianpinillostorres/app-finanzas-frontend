<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#378add" />
      <stop offset="1" stop-color="#0c447c" />
    </linearGradient>
  </defs>
  <!-- Fondo a sangre completa: necesario para maskable icons (Android/iOS recortan con distintas formas). -->
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- Barras ascendentes, dentro del "safe zone" (círculo central ~80%) para que no se corten al enmascarar. -->
  <rect x="146" y="256" width="64" height="90" rx="14" fill="#f7f7f5" />
  <rect x="224" y="196" width="64" height="150" rx="14" fill="#f7f7f5" />
  <rect x="302" y="136" width="64" height="210" rx="14" fill="#f7f7f5" />
</svg>
