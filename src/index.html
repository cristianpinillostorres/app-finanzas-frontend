<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Finanzas personales</title>
    <base href="/" />
    <!--
      Aplica el tema y el modo guardados (`ThemeService`, `data-theme` y
      `data-modo` en `<html>`) antes del primer pintado — de lo contrario
      se ve un parpadeo: la app arranca en Teal claro (CSS puro, instantáneo)
      y recién después de que Angular carga, `ThemeService` corrige al tema
      guardado. Bloqueante a propósito, mínimo, sin dependencias.
    -->
    <script>
      try {
        // Login: siempre Teal claro (ver `ThemeService.soloClaro`). Bienvenida:
        // el tema elegido pero en claro (`ThemeService.soloModoClaro`).
        var ruta = location.pathname;
        var esLogin = /^\/login(\/|$)/.test(ruta);
        var esBienvenida = /^\/bienvenida(\/|$)/.test(ruta);
        var temas = ['teal', 'neutro', 'medianoche', 'brasa', 'marino'];
        var tema = localStorage.getItem('finanzas.tema');
        var modo = localStorage.getItem('finanzas.modo');
        // Volviendo de la bienvenida al login ("¿Ya tienes cuenta? Entra"):
        // el panel de marca queda pintado durante la recarga (ver
        // `TransicionLogin.marcarVuelta` y `html[data-puente]` en styles.scss).
        var vuelta = sessionStorage.getItem('finanzas.vuelta-login') === '1';
        if (vuelta) document.documentElement.setAttribute('data-puente', '');
        if (esLogin || vuelta || temas.indexOf(tema) === -1) tema = 'teal';
        if (esLogin || esBienvenida || (modo !== 'claro' && modo !== 'oscuro')) modo = 'claro';
        document.documentElement.setAttribute('data-theme', tema);
        document.documentElement.setAttribute('data-modo', modo);
      } catch (e) {}
    </script>
    <!--
      `viewport-fit=cover`: sin esto, `env(safe-area-inset-*)` (ya usado
      en `.barra-inferior`/`.fab-nuevo`/`.contenido--movil`, ver
      shell.scss) siempre vale 0 — el navegador no considera que haya
      ninguna zona "seguridad" de la que protegerse, así que el contenido
      fijo queda pegado a los bordes redondos/gestos del iPhone en vez de
      respetarlos.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Modo standalone al agregar como ícono de inicio en iOS (Safari no lee el manifest de PWA para esto). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <!--
      Barra del navegador en Android (sin efecto directo en iOS, ahí manda
      `apple-mobile-web-app-status-bar-style`). Arranca con la página de
      Teal; `ThemeService` lo cambia al tema elegido (ver `COLOR_BARRA`).
    -->
    <meta name="theme-color" content="#f6f8f9" />
    <!-- Ícono de la pantalla de inicio en iOS — Safari no lee `icons` del manifest para esto, necesita su propio `<link>`. -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Las fuentes de Mi Semana (ver DESIGN.md y el `@font-face` de
      `styles.scss`): se piden desde ya para que el primer pintado no salga
      con la del sistema y salte al llegar.
    -->
    <link
      rel="preload"
      href="fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin=""
    />
    <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..24,400,0..1&amp;display=block"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
