<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Finanzas personales</title>
    <base href="/" />
    <!--
      Volviendo de la bienvenida al login ("¿Ya tienes cuenta? Entra"): el
      panel de marca queda pintado durante la recarga (ver
      `TransicionLogin.marcarVuelta` y `html[data-puente]` en styles.scss).
      Bloqueante a propósito, mínimo, sin dependencias.
    -->
    <script>
      try {
        if (sessionStorage.getItem('finanzas.vuelta-login') === '1') {
          document.documentElement.setAttribute('data-puente', '');
        }
      } catch (e) {}
      // El modo que fijó la persona en Configuración (ver `ThemeService`),
      // antes del primer pintado para que la página no parpadee.
      try {
        var tema = localStorage.getItem('finanzas.tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.setAttribute('data-theme', tema === 'claro' ? 'light' : 'dark');
        }
      } catch (e) {}
    </script>
    <!--
      `viewport-fit=cover`: sin esto, `env(safe-area-inset-*)` (ya usado
      en `.barra-inferior`/`.fab-nuevo`/`.contenido--movil`, ver
      shell.scss) siempre vale 0 — el navegador no considera que haya
      ninguna zona "seguridad" de la que protegerse, así que el contenido
      fijo queda pegado a los bordes redondos/gestos del iPhone en vez de
      respetarlos.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Modo standalone al agregar como ícono de inicio en iOS (Safari no lee el manifest de PWA para esto). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <!--
      Barra del navegador en Android (sin efecto directo en iOS, ahí manda
      `apple-mobile-web-app-status-bar-style`): el fondo de la página en cada
      modo, Blanco y Abismo de la marca.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11212d" />
    <!-- Ícono de la pantalla de inicio en iOS — Safari no lee `icons` del manifest para esto, necesita su propio `<link>`. -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Las fuentes de Mi Semana (ver DESIGN.md y el `@font-face` de
      `styles.scss`): se piden desde ya para que el primer pintado no salga
      con la del sistema y salte al llegar.
    -->
    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin=""
    />
    <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..24,400,0..1&amp;display=block"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
