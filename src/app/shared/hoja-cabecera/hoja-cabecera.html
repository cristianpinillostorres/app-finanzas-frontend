<header class="barra">
  <button
    type="button"
    class="barra__cerrar"
    [disabled]="cerrarDeshabilitado()"
    (click)="cerrar.emit()"
  >
    {{ textoCerrar() }}
  </button>
  <h2 class="barra__titulo" [attr.title]="titulo()">{{ titulo() }}</h2>
  @if (textoAccion(); as texto) {
    <button type="button" class="barra__cerrar barra__accion" (click)="accion.emit()">
      {{ texto }}
    </button>
  } @else {
    <span aria-hidden="true"></span>
  }
</header>
