<header class="page-head">
  @if (icono()) {
    <span class="page-head__sello" aria-hidden="true">
      <mat-icon>{{ icono() }}</mat-icon>
    </span>
  }
  <div class="page-head__texto">
    <h1 class="page-head__titulo">{{ titulo() }}</h1>
    @if (detalle()) {
      <span class="t-meta">{{ detalle() }}</span>
    }
  </div>
  <div class="page-head__acciones">
    <ng-content></ng-content>
  </div>
</header>
