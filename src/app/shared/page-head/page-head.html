<header class="page-head">
  <div class="page-head__texto">
    <h1 class="page-head__titulo">{{ titulo() }}</h1>
    @if (detalle()) {
      <span class="t-meta">{{ detalle() }}</span>
    }
  </div>
  <div class="page-head__acciones">
    <ng-content></ng-content>
  </div>
  @if (accionesGlobales(); as plantilla) {
    <div class="page-head__globales">
      <ng-container *ngTemplateOutlet="plantilla" />
    </div>
  }
</header>
