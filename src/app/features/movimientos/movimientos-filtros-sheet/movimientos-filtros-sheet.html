<div class="cuerpo">
  <app-hoja-cabecera titulo="Filtros" (cerrar)="cerrar()" />

  <div class="grupo-filtro">
    <span class="t-sec">Tipo</span>
    <div class="chips">
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().tipo === 'todos'"
        (click)="fijarTipo('todos')"
      >
        Todos
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().tipo === 'GASTO'"
        (click)="fijarTipo('GASTO')"
      >
        Gastos
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().tipo === 'INGRESO'"
        (click)="fijarTipo('INGRESO')"
      >
        Ingresos
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().tipo === 'transferencia'"
        (click)="fijarTipo('transferencia')"
      >
        Transferencias
      </button>
    </div>
  </div>

  <div class="grupo-filtro">
    <span class="t-sec">Fecha</span>
    <div class="chips">
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().fecha === 'todo-mes'"
        (click)="fijarFecha('todo-mes')"
      >
        Todo el mes
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().fecha === 'hoy'"
        (click)="fijarFecha('hoy')"
      >
        Hoy
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().fecha === '7-dias'"
        (click)="fijarFecha('7-dias')"
      >
        Últimos 7 días
      </button>
      <button
        class="chip"
        type="button"
        [attr.aria-pressed]="draft().fecha === 'rango'"
        (click)="fijarFecha('rango')"
      >
        Rango
      </button>
    </div>
    @if (draft().fecha === 'rango') {
      <div class="form-2">
        <div class="field">
          <label for="f-desde">Desde</label>
          <input
            class="input"
            id="f-desde"
            type="date"
            #campoDesde
            [value]="draft().desde ?? data.minFecha"
            [min]="data.minFecha"
            [max]="draft().hasta ?? data.maxFecha"
            (change)="fijarDesde(campoDesde.value)"
          />
        </div>
        <div class="field">
          <label for="f-hasta">Hasta</label>
          <input
            class="input"
            id="f-hasta"
            type="date"
            #campoHasta
            [value]="draft().hasta ?? data.maxFecha"
            [min]="draft().desde ?? data.minFecha"
            [max]="data.maxFecha"
            (change)="fijarHasta(campoHasta.value)"
          />
        </div>
      </div>
    }
  </div>

  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-cta">Cuenta o crédito</label>
      <app-selector
        inputId="s-cta"
        [opciones]="data.opcionesCuentaOCredito"
        campoValor="id"
        opcionTodas="Todas"
        [valor]="draft().cuentaOCreditoId ?? null"
        (cambio)="fijarCuentaOCredito($any($event))"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-cat">Categoría</label>
      <app-selector
        inputId="s-cat"
        [opciones]="data.categorias"
        campoValor="id"
        campoEtiqueta="nombre"
        campoIcono="icono"
        opcionTodas="Todas"
        [valor]="draft().categoriaId ?? null"
        (cambio)="fijarCategoria($any($event))"
      />
    </div>
    <label class="ios-fila" for="s-internos">
      <span class="ios-fila__rotulo">Movimientos internos</span>
      <input
        class="ios-interruptor"
        id="s-internos"
        type="checkbox"
        [checked]="draft().mostrarInternos"
        (change)="fijarInternos($any($event.target).checked)"
      />
    </label>
  </div>
</div>

<div class="sheet-ft">
  <button class="btn btn-outline" type="button" (click)="limpiar()">Limpiar</button>
  <button class="btn btn-primary" type="button" (click)="aplicar()">Aplicar</button>
</div>
