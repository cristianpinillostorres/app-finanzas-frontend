<div class="cuerpo">
  <app-hoja-cabecera
    titulo="Filtros"
    textoAccion="Aplicar"
    (cerrar)="cerrar()"
    (accion)="aplicar()"
  />

  <!-- Todo en filas de iOS: rótulo a la izquierda y el valor elegido a la
       derecha, que abre su lista al tocarlo. -->
  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-tipo">Tipo</label>
      <app-selector
        inputId="s-tipo"
        [opciones]="opcionesTipo"
        [valor]="draft().tipo"
        (cambio)="fijarTipo($any($event))"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-fecha">Fecha</label>
      <app-selector
        inputId="s-fecha"
        [opciones]="opcionesFecha"
        [valor]="draft().fecha"
        (cambio)="fijarFecha($any($event))"
      />
    </div>
    @if (draft().fecha === 'rango') {
      <label class="ios-fila" for="f-desde">
        <span class="ios-fila__rotulo">Desde</span>
        <input
          class="ios-fila__valor"
          id="f-desde"
          type="date"
          #campoDesde
          [value]="draft().desde ?? data.minFecha"
          [min]="data.minFecha"
          [max]="draft().hasta ?? data.maxFecha"
          (change)="fijarDesde(campoDesde.value)"
        />
      </label>
      <label class="ios-fila" for="f-hasta">
        <span class="ios-fila__rotulo">Hasta</span>
        <input
          class="ios-fila__valor"
          id="f-hasta"
          type="date"
          #campoHasta
          [value]="draft().hasta ?? data.maxFecha"
          [min]="draft().desde ?? data.minFecha"
          [max]="data.maxFecha"
          (change)="fijarHasta(campoHasta.value)"
        />
      </label>
    }
  </div>

  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-cta">Cuenta o crédito</label>
      <app-selector
        inputId="s-cta"
        [opciones]="data.opcionesCuentaOCredito"
        campoValor="id"
        opcionTodas="Todas"
        [valor]="draft().cuentaOCreditoId ?? null"
        (cambio)="fijarCuentaOCredito($any($event))"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="s-cat">Categoría</label>
      <app-selector
        inputId="s-cat"
        [opciones]="data.categorias"
        campoValor="id"
        campoEtiqueta="nombre"
        campoIcono="icono"
        opcionTodas="Todas"
        [valor]="draft().categoriaId ?? null"
        (cambio)="fijarCategoria($any($event))"
      />
    </div>
    <label class="ios-fila" for="s-internos">
      <span class="ios-fila__rotulo">Movimientos internos</span>
      <input
        class="ios-interruptor"
        id="s-internos"
        type="checkbox"
        [checked]="draft().mostrarInternos"
        (change)="fijarInternos($any($event.target).checked)"
      />
    </label>
  </div>

  <!-- Como "Restablecer" en los ajustes de iOS: una fila sola, en el color
       de acento. No cierra la hoja; lo aplica "Aplicar". -->
  <div class="ios-grupo">
    <button class="ios-fila fila-limpiar" type="button" (click)="limpiar()">Limpiar filtros</button>
  </div>
</div>
