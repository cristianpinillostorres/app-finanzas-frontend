<app-hoja-cabecera
  [titulo]="editando ? 'Editar pago fijo' : 'Nuevo pago fijo'"
  (cerrar)="cerrar()"
/>

<form class="ios-form" [formGroup]="form" (ngSubmit)="guardar()">
  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-nombre">Nombre</label>
      <input class="input" id="pf-nombre" placeholder="Arriendo" formControlName="nombre" />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-categoria">Categoría</label>
      <app-selector
        inputId="pf-categoria"
        formControlName="categoriaId"
        [opciones]="categoriasGasto()"
        campoValor="id"
        campoEtiqueta="nombre"
        campoIcono="icono"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-cuenta">Se paga con</label>
      <app-selector
        inputId="pf-cuenta"
        formControlName="cuentaDefaultId"
        [opciones]="opcionesCuentas()"
        campoValor="id"
      />
    </div>
  </div>

  <h3 class="ios-seccion">Monto</h3>
  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-monto">{{
        form.controls.esVariable.value ? 'Monto estimado' : 'Monto'
      }}</label>
      <input class="input" id="pf-monto" appMonto placeholder="$ 0" formControlName="monto" />
    </div>
    <label class="ios-fila" for="pf-variable">
      <span class="ios-fila__rotulo">Monto variable</span>
      <input
        class="ios-interruptor"
        id="pf-variable"
        type="checkbox"
        formControlName="esVariable"
      />
    </label>
  </div>
  <p class="ios-nota">
    @if (form.controls.esVariable.value) {
      Al pagar se anota el valor real; mientras tanto se muestra el estimado.
    } @else {
      Actívalo para pagos que cambian cada mes: luz, agua, gas.
    }
  </p>

  <h3 class="ios-seccion">Cuándo se paga</h3>
  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-dia">Día límite</label>
      <input
        class="input"
        id="pf-dia"
        type="number"
        inputmode="numeric"
        min="1"
        max="31"
        formControlName="diaLimite"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="pf-frecuencia">Frecuencia</label>
      <app-selector inputId="pf-frecuencia" formControlName="frecuencia" [opciones]="frecuencias" />
    </div>
    @if (mostrarMesInicio()) {
      <div class="ios-fila">
        <label class="ios-fila__rotulo" for="pf-mes">{{
          form.controls.frecuencia.value === 'ANUAL' ? 'Mes en que aplica' : 'Primer mes'
        }}</label>
        <app-selector inputId="pf-mes" formControlName="mesInicio" [opciones]="meses" />
      </div>
    }
  </div>

  <button class="btn btn-primary btn-block" type="submit" [disabled]="guardando()">
    @if (guardando()) {
      <span class="spinner" aria-hidden="true"></span>
    }
    {{ editando ? 'Guardar cambios' : 'Crear pago fijo' }}
  </button>
</form>
