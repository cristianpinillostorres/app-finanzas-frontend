<app-hoja-cabecera
  [titulo]="editando ? 'Editar categoría' : 'Nueva categoría'"
  (cerrar)="cerrar()"
/>

<form class="ios-form" [formGroup]="form" (ngSubmit)="guardar()">
  @if (!editando) {
    <div class="ios-segmentado" role="group" aria-label="Tipo de categoría">
      <button
        type="button"
        [attr.aria-pressed]="form.controls.tipo.value === 'GASTO'"
        (click)="form.controls.tipo.setValue('GASTO')"
      >
        Gasto
      </button>
      <button
        type="button"
        [attr.aria-pressed]="form.controls.tipo.value === 'INGRESO'"
        (click)="form.controls.tipo.setValue('INGRESO')"
      >
        Ingreso
      </button>
    </div>
  }

  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="cat-nombre">Nombre</label>
      <input
        class="input"
        id="cat-nombre"
        placeholder="Mascotas"
        maxlength="40"
        autocomplete="off"
        formControlName="nombre"
      />
    </div>
    @if (form.controls.tipo.value === 'GASTO') {
      <div class="ios-fila">
        <label class="ios-fila__rotulo" for="cat-tope">Tope mensual</label>
        <input
          class="input"
          id="cat-tope"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="Opcional"
          formControlName="topeMensual"
        />
      </div>
    }
  </div>
  @if (form.controls.tipo.value === 'GASTO') {
    <p class="ios-nota">Lo máximo que quieres gastar al mes aquí. Te avisamos al llegar al 80 %.</p>
  }

  <h3 class="ios-seccion" id="cat-icono-label">Ícono</h3>
  <div class="ios-grupo ios-grupo--libre">
    <div class="iconos" role="radiogroup" aria-labelledby="cat-icono-label">
      @for (icono of iconos; track icono) {
        <button
          type="button"
          class="icono"
          role="radio"
          [attr.aria-checked]="form.controls.icono.value === icono"
          [attr.aria-label]="icono"
          (click)="elegirIcono(icono)"
        >
          <mat-icon aria-hidden="true">{{ icono }}</mat-icon>
        </button>
      }
    </div>
  </div>

  <button class="btn btn-primary btn-block" type="submit" [disabled]="guardando()">
    @if (guardando()) {
      <span class="spinner" aria-hidden="true"></span>
    }
    {{ editando ? 'Guardar cambios' : 'Crear categoría' }}
  </button>
</form>
