<app-hoja-cabecera titulo="Cambiar tasa" (cerrar)="cerrar()" />

<form class="ios-form" [formGroup]="form" (ngSubmit)="guardar()">
  <p class="ios-nota ios-nota--arriba">
    {{ credito.nombre }}: la nueva tasa efectiva anual (E.A.) que te informó el banco y desde cuándo
    aplica.
  </p>

  <div class="ios-grupo">
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="ct-fecha">Vigente desde</label>
      <input
        autocomplete="off"
        class="input"
        id="ct-fecha"
        type="date"
        formControlName="fechaDesde"
      />
    </div>
    <div class="ios-fila">
      <label class="ios-fila__rotulo" for="ct-tasa">Tasa E.A. (%)</label>
      <input
        autocomplete="off"
        class="input"
        id="ct-tasa"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="0,00"
        formControlName="tasaEaPorcentaje"
      />
    </div>
  </div>

  <button class="btn btn-primary btn-block" type="submit" [disabled]="guardando()">
    @if (guardando()) {
      <span class="spinner" aria-hidden="true"></span>
    }
    Guardar tasa
  </button>
</form>
